<!DOCTYPE html>
<html>
<head>
    <title>David's Website</title>
    <link rel="icon" type="image/jpeg" href="blueprint.jpg">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
        }
        h1 {
            color: #ff6600;
            -webkit-text-stroke: 2px black;
            text-stroke: 2px black;
            font-weight: bold;
            font-size: 72px;
        }
        p {
            line-height: 1.6;
            color: white;
        }
        /* Navigation Menu */
        nav {
            background-color: #ff6600;
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 30px;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        nav ul li a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background-color 0.3s;
        }
        nav ul li a:hover {
            background-color: black;
            color: #ff6600;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#history">History</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Header with photos and title -->
    <div id="home" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px;">
        <img src="301 Yonge.jpg" alt="301 Yonge Street" style="max-width: 275px; border-radius: 10px;">
        <h1 style="flex-grow: 1; margin: 0 20px; text-align: center;">Welcome to My Website</h1>
        <img src="Lightpole.jpg" alt="Light Pole" style="max-width: 375px; border-radius: 10px;">
    </div>
    <p style="text-align: center; font-size: 20px;">Currently in development!</p>

</body>
</html>
